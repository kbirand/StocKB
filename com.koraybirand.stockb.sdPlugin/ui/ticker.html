<!DOCTYPE html>
<html>
  <head lang="tr">
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Sembol">
      <sdpi-textfield setting="sembol" default="USD" placeholder="USD, EUR, GRA…" required></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Etiket">
      <sdpi-textfield setting="label" placeholder="örn. Dolar"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Yenileme (sn)">
      <sdpi-textfield setting="interval" type="number" default="60" min="15"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Etiket Boyutu">
      <sdpi-range setting="labelSize" default="22" min="8" max="48" step="1" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="Fiyat Boyutu">
      <sdpi-range setting="priceSize" default="26" min="8" max="48" step="1" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="Değişim Boyutu">
      <sdpi-range setting="changeSize" default="22" min="8" max="48" step="1" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="Üst Boşluk">
      <sdpi-range setting="topPad" default="0" min="0" max="60" step="1" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="Arka Plan">
      <sdpi-color setting="bgColor" default="#101418"></sdpi-color>
    </sdpi-item>

    <details>
      <summary>Yaygın semboller</summary>
      <small>
        <b>Döviz:</b> USD (Dolar), EUR (Euro), GBP (Sterlin), CHF, JPY<br />
        <b>Altın:</b> GRA (Gram), CEYREKALTIN, YARIMALTIN, TAMALTIN, CUMHURIYETALTINI<br />
        <b>Diğer:</b> GUMUS (Gümüş), XU100 (BIST 100)
      </small>
    </details>
  </body>
</html>
